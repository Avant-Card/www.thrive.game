<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Thrive — Coming Soon</title>
<meta name="description" content="Thrive is an indie survival card game about cute, cunning, and curious animals. Follow along for sneak peeks, launch news, and early bird perks." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#F4E9D6; --paper-2:#EADBC1; --paper-3:#E1CFAF;
    --ink:#2A2520; --ink-soft:#4A3F36;
    --coral:#E89870; --coral-deep:#D6764B;
    --leaf:#2F6B3E; --leaf-deep:#245530; --leaf-soft:#88A878;
    --acorn:#6B4A2A;
    --rule:rgba(42,37,32,0.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100dvh; display:flex; flex-direction:column;
    background:
      radial-gradient(76% 66% at 10% 108%, color-mix(in oklab, var(--leaf-soft) 30%, transparent) 0%, transparent 60%),
      radial-gradient(70% 62% at 96% -8%, color-mix(in oklab, var(--coral) 26%, transparent) 0%, transparent 58%),
      linear-gradient(168deg, #F8F0E1 0%, var(--paper) 44%, #E7D8BB 100%);
    background-attachment:fixed; color:var(--ink);
    font-family:'Inter Tight',-apple-system,system-ui,sans-serif;
    font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* central paper glow — lifts the content clear of the floating field */
  body::after{
    content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(58% 52% at 50% 44%, var(--paper) 0%, color-mix(in oklab,var(--paper) 82%,transparent) 42%, transparent 72%);
  }
  /* paper grain */
  body::before{
    content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px, rgba(42,37,32,0.06) 1px, transparent 0);
    background-size:3px 3px; mix-blend-mode:multiply; opacity:0.5;
  }
  /* ============ FALLING ACORNS ============ */
  .acorn-fall{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
  .acorn{position:absolute; top:0; height:auto; display:block; will-change:transform;
    filter:drop-shadow(0 6px 10px rgba(42,37,32,0.18));
    animation-name:fall; animation-timing-function:cubic-bezier(.45,.06,.7,.72); animation-iteration-count:1}
  @keyframes fall{
    0%{transform:translate3d(0,-20vh,0) rotate(var(--r0,0deg))}
    100%{transform:translate3d(var(--drift,0px),120vh,0) rotate(var(--r1,180deg))}
  }
  /* ============ NUTTY — waving from the corner ============ */
  .nutty-corner{position:fixed; right:0; bottom:0; z-index:2; pointer-events:none;
    width:clamp(190px,24vw,360px); height:auto; display:block;
    filter:drop-shadow(0 12px 24px rgba(42,37,32,0.20))}
  @media (max-width:880px){ .nutty-corner{width:clamp(160px,26vw,240px); opacity:.9} }
  @media (max-width:560px){ .nutty-corner{display:none} }
  h1{font-family:'Bricolage Grotesque',serif; font-weight:800; letter-spacing:-0.02em; line-height:1.0; margin:0; text-wrap:balance}
  a{color:var(--leaf-deep); text-decoration:none}
  a:hover{color:var(--coral-deep)}

  /* ============ CONTENT ============ */
  .content{flex:1; position:relative; z-index:2; display:grid; place-items:center;
    padding:clamp(32px,6vh,72px) 24px clamp(20px,3vh,32px)}
  .stage{max-width:600px; width:100%; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:clamp(16px,2.6vh,26px)}
  @media (prefers-reduced-motion:no-preference){
    .stage[data-fx]:not([data-fx="none"]) .fx-item{
      opacity:0;
      animation-duration:var(--fx-dur,.7s);
      animation-timing-function:cubic-bezier(.2,.7,.3,1);
      animation-fill-mode:both;
      animation-delay:calc(var(--fx-step,.1s) * var(--i,0));
    }
    .stage[data-fx="rise"] .fx-item{animation-name:rise}
    .stage[data-fx="fade"] .fx-item{animation-name:fadein}
    .stage[data-fx="slide"] .fx-item{animation-name:slidein}
    .stage[data-fx="zoom"] .fx-item{animation-name:zoomin}
    .stage[data-fx="blur"] .fx-item{animation-name:blurin}
    .stage[data-fx="drop"] .fx-item{animation-name:dropin; animation-timing-function:cubic-bezier(.3,1.4,.5,1)}
  }
  @keyframes rise{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
  @keyframes fadein{from{opacity:0} to{opacity:1}}
  @keyframes slidein{from{opacity:0; transform:translateX(-28px)} to{opacity:1; transform:none}}
  @keyframes zoomin{from{opacity:0; transform:scale(.9)} to{opacity:1; transform:none}}
  @keyframes blurin{from{opacity:0; filter:blur(11px)} to{opacity:1; filter:blur(0)}}
  @keyframes dropin{0%{opacity:0; transform:translateY(-30px)} 65%{opacity:1; transform:translateY(5px)} 100%{transform:translateY(0)}}

  .logo{width:clamp(230px,36vw,380px); height:auto; display:block;
    filter:drop-shadow(0 10px 22px rgba(42,37,32,0.18))}

  .eyebrow{display:inline-flex; align-items:center; gap:10px; margin:0;
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700;
    letter-spacing:0.2em; text-transform:uppercase; color:var(--leaf)}
  .eyebrow::before,.eyebrow::after{content:""; width:22px; height:2px; background:currentColor; opacity:.55}
  .eyebrow .pulse{width:7px; height:7px; border-radius:50%; background:var(--coral);
    box-shadow:0 0 0 0 rgba(232,152,112,.6)}
  @media (prefers-reduced-motion:no-preference){ .eyebrow .pulse{animation:beat 2.4s ease-in-out infinite} }
  @keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(232,152,112,.55)} 50%{box-shadow:0 0 0 7px rgba(232,152,112,0)}}

  h1{font-size:clamp(38px,6.6vw,64px)}
  h1 em{font-style:normal; color:var(--coral-deep)}

  .sub{margin:0; color:var(--ink-soft); font-size:clamp(15px,1.9vh,17.5px); line-height:1.6;
    display:flex; flex-direction:column; align-items:center; gap:1.35em; text-wrap:pretty}
  .sub-line{white-space:nowrap}
  .sub-line--label{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
    letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-soft)}
  .fhl{transition:color .16s ease}
  @media (max-width:640px){
    .sub{gap:1.05em; max-width:42ch}
    .sub-line{white-space:normal}
  }

  .follow-label{margin:clamp(4px,1vh,10px) 0 0; font-family:'JetBrains Mono',monospace;
    font-size:11px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-soft)}

  .socials{display:flex; flex-wrap:wrap; justify-content:center; gap:12px}
  .socials a,.socials .disabled{
    width:48px; height:48px; display:grid; place-items:center; border-radius:50%;
    transition:transform .16s ease, background .16s ease, color .16s ease, border-color .16s ease}
  .socials a{color:#FBF3E2; background:var(--leaf); border:1.5px solid var(--leaf-deep)}
  .socials .disabled{color:var(--ink); background:var(--paper-2); border:1.5px solid var(--rule)}
  .socials a:hover{transform:translateY(-4px); background:var(--coral-deep); color:#FBF3E2; border-color:var(--coral-deep)}
  .socials a:active{transform:translateY(-1px)}
  .socials .disabled{opacity:.34; cursor:not-allowed; position:relative}
  .socials .disabled:hover{opacity:.5}
  .socials .disabled::after{content:attr(data-tip); position:absolute; bottom:calc(100% + 9px); left:50%;
    transform:translateX(-50%) translateY(4px); background:var(--ink); color:var(--paper);
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; white-space:nowrap; padding:5px 9px; border-radius:7px;
    opacity:0; pointer-events:none; transition:opacity .15s ease, transform .15s ease; z-index:5}
  .socials .disabled::before{content:""; position:absolute; bottom:calc(100% + 5px); left:50%;
    transform:translateX(-50%) translateY(4px); border:4px solid transparent; border-top-color:var(--ink);
    opacity:0; pointer-events:none; transition:opacity .15s ease, transform .15s ease; z-index:5}
  .socials .disabled:hover::after,.socials .disabled:hover::before{opacity:1; transform:translateX(-50%) translateY(0)}
  .socials svg{width:20px; height:20px; display:block}
  .socials svg.bgg-mark{width:27px; height:auto}

  /* ============ ACCOLADES ============ */
  .accolades{display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start;
    gap:clamp(8px,2.5vw,28px); width:100%; margin-top:clamp(4px,1.4vh,14px)}
  .acc-lead{width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    margin:0 0 4px; font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700;
    letter-spacing:0.22em; text-transform:uppercase; color:var(--ink-soft); opacity:.72}
  .acc-lead::before,.acc-lead::after{content:""; width:28px; height:1.5px; background:currentColor; opacity:.5}
  .accolade{width:clamp(150px,47%,292px); flex:none}
  .award{width:100%; height:auto; display:block}

  /* ============ FOOTER ============ */
  footer{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:clamp(16px,3vh,30px) 24px clamp(20px,3.4vh,34px)}
  .footer-brand{display:inline-flex; align-items:center; gap:10px;
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-soft)}
  .footer-brand img{height:22px; width:auto; opacity:.8}
  .copyright{margin:0; font-size:11px; color:var(--ink-soft); opacity:.62; letter-spacing:.01em}
</style>
</head>
<body>
  <div class="acorn-fall" id="acornFall" aria-hidden="true"></div>
  <img class="nutty-corner" src="uploads/nutty_hello.png" alt="" aria-hidden="true" />
  <main class="content">

        </span>

        </span>
        <span class="disabled" data-tip="Coming soon" aria-label="YouTube (coming soon)" aria-disabled="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.5 7.2a3 3 0 0 0-2.1-2.1C18.6 4.6 12 4.6 12 4.6s-6.6 0-8.4.5A3 3 0 0 0 1.5 7.2C1 9 1 12 1 12s0 3 .5 4.8a3 3 0 0 0 2.1 2.1c1.8.5 8.4.5 8.4.5s6.6 0 8.4-.5a3 3 0 0 0 2.1-2.1C23 15 23 12 23 12s0-3-.5-4.8ZM9.9 15.4V8.6l5.7 3.4-5.7 3.4z"/></svg>

        </span>
      </div>
      <div class="accolades fx-item" style="--i:5">
        <div class="accolade">
          <img class="award" src="assets/laurel_pax_gold.png" alt="AUS Indie Showcase — PAX AUS 2026" />
        </div>
        <div class="accolade">
          <img class="award" src="assets/laurel_panda_gold.png" alt="Panda 25 in 25" />
        </div>
      </div>
    </div>
  </main>

  <footer>
    <a class="footer-brand" href="https://www.avant-card.com" target="_blank" rel="noopener" aria-label="Avant-Card">
      <img src="assets/avant-neo.svg" alt="Avant-Card" />
    </a>
    <p class="copyright">Copyright &copy; 2026 Avant-Card Games. All Rights Reserved.</p>
  </footer>
  <script>
    (function(){
      var layer = document.getElementById('acornFall');
      if(!layer) return;
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var SRC = 'uploads/FALLING-ACORN.png';
      var rnd = function(a,b){return a + Math.random()*(b-a);};
      function drop(){
        if(document.hidden) return;
        var a = document.createElement('img');
        a.className = 'acorn'; a.src = SRC; a.alt = '';
        var size = rnd(24,54);
        a.style.width = size.toFixed(0)+'px';
        a.style.left = rnd(1,95).toFixed(2)+'vw';
        a.style.opacity = rnd(0.5,0.9).toFixed(2);
        a.style.setProperty('--drift', rnd(-70,70).toFixed(0)+'px');
        var r0 = rnd(-25,25);
        a.style.setProperty('--r0', r0.toFixed(0)+'deg');
        a.style.setProperty('--r1', (r0 + rnd(-150,150)).toFixed(0)+'deg');
        a.style.animationDuration = rnd(6.5,10.5).toFixed(1)+'s';
        a.addEventListener('animationend', function(){ a.remove(); });
        layer.appendChild(a);
      }
      // a few staggered on load so the screen isn't empty at first
      for(var i=0;i<4;i++){ setTimeout(drop, i*1500 + rnd(0,700)); }
      // ongoing gentle cadence
      (function loop(){ setTimeout(function(){ drop(); loop(); }, rnd(1700,3400)); })();
    })();
  </script>
</body>
</html>
